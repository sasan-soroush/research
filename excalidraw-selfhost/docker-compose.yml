services:
  excalidraw:
    build:
      context: .
      args:
        # Must be the public URL people open in the browser
        VITE_APP_WS_SERVER_URL: ${PUBLIC_URL:-https://localhost}
    restart: unless-stopped

  room:
    image: excalidraw/excalidraw-room:latest
    restart: unless-stopped
    environment:
      CORS_ORIGIN: ${PUBLIC_URL:-https://localhost}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - excalidraw
      - room

volumes:
  caddy_data:
  caddy_config:
